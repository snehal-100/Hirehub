# Application configuration
spring.application.name=hirehub-backend
server.port=8081

# Database Configuration (Port 3306, with auto-create database)
spring.datasource.url=jdbc:mysql://localhost:3306/hirehub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=THEGAME@1301
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom File Storage Directories
file.upload-dir=uploads
file.resume-dir=uploads/resumes
file.logo-dir=uploads/logos
file.photo-dir=uploads/photos

# Security JWT Configuration
# 256-bit secret key: "HireHubBackendSecretKeyForJWTHireHubBackendSecretKeyForJWT"
security.jwt.secret-key=HireHubBackendSecretKeyForJWTHireHubBackendSecretKeyForJWT
security.jwt.expiration-time=86400000
